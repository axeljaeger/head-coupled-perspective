name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Builds the library (ESM + .d.ts) and the demo (downloads the MediaPipe model).
      - run: npm run build
      - name: Check the npm package contents
        run: npm pack --dry-run -w head-coupled-perspective
